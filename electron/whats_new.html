<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New in SINBHA</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --border: #2d3748;
      --accent: #f472b6;
      --accent-gradient: linear-gradient(135deg, #ec4899, #f43f5e);
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      user-select: none;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.5);
      text-align: center;
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(244, 114, 182, 0.15);
      border: 2px solid rgba(244, 114, 182, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
    }
    .version-tag {
      display: inline-block;
      background: rgba(244, 114, 182, 0.2);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    h2 { font-size: 20px; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: var(--subtext); margin-bottom: 20px; }
    .features-list {
      text-align: left;
      background: rgba(15, 17, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      list-style: none;
    }
    .features-list li {
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #cbd5e1;
    }
    .features-list li:last-child { margin-bottom: 0; }
    .btn {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
      transition: transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="modal">
    <div class="icon-badge">✨</div>
    <span class="version-tag" id="verBadge">v1.0.0</span>
    <h2>What's New in SINBHA</h2>
    <p class="sub">Here are the latest updates for your companion 🐘</p>

    <ul class="features-list" id="featuresList">
      <li><span>🕊️</span> Transparent desktop bird reminder flights</li>
      <li><span>☁️</span> Connected to secure cloud PostgreSQL backend</li>
      <li><span>🔒</span> Full privacy hardening and field-level encryption</li>
      <li><span>⚡</span> Silent auto-updates & instant notifications</li>
    </ul>

    <button class="btn" id="closeBtn">Got it, let's go! 🐘</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('whats-new-data', (_event, data) => {
      if (data.version) {
        document.getElementById('verBadge').textContent = `v${data.version}`;
      }
      if (data.features && data.features.length) {
        const list = document.getElementById('featuresList');
        list.innerHTML = '';
        data.features.forEach(f => {
          const li = document.createElement('li');
          li.innerHTML = f;
          list.appendChild(li);
        });
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
