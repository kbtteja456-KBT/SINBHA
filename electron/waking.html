<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINBHA - Waking Up</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181b24;
      --text: #e2e8f0;
      --subtext: #94a3b8;
      --accent: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.35);
      --border: #2d3748;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
    }
    .logo-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 25px var(--accent-glow);
      animation: float 3s ease-in-out infinite;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    h1 span {
      color: var(--accent);
    }
    p {
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(244, 114, 182, 0.1);
      border: 1px solid rgba(244, 114, 182, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.2s infinite;
    }
    .retry-btn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="pulse-ring"></div>
      <img src="icon.png" alt="SINBHA Logo" class="logo-img" onerror="this.src='tray_icon.png'">
    </div>
    <h1>SINBHA is <span>Waking Up</span> 🐘</h1>
    <p>
      Your personal AI companion is warming up in the cloud.<br>
      This only takes a few seconds—hang tight!
    </p>

    <div class="status-badge">
      <div class="dot"></div>
      <span id="statusText">Connecting in <b id="countdown">5</b>s...</span>
    </div>

    <div>
      <button id="retryBtn" class="retry-btn">Retry Now ⚡</button>
    </div>

    <div class="footer-note">
      Automatic health check active • Never a blank screen
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://sinbha-backend.onrender.com';
    let secondsLeft = 5;
    let timer = null;

    async function checkHealth() {
      const statusText = document.getElementById('statusText');
      statusText.innerHTML = 'Pinging cloud server...';

      try {
        const res = await fetch(`${BACKEND_URL}/api/health`, { cache: 'no-store' });
        if (res.ok) {
          statusText.innerHTML = 'Connected! Loading app... 🐘';
          window.location.href = BACKEND_URL;
          return;
        }
      } catch (err) {
        // Still waking up
      }

      secondsLeft = 5;
      startCountdown();
    }

    function startCountdown() {
      clearInterval(timer);
      const countdownEl = document.getElementById('countdown');
      const statusText = document.getElementById('statusText');

      timer = setInterval(() => {
        secondsLeft--;
        if (countdownEl) countdownEl.textContent = secondsLeft;
        statusText.innerHTML = `Retrying in <b>${secondsLeft}</b>s...`;

        if (secondsLeft <= 0) {
          clearInterval(timer);
          checkHealth();
        }
      }, 1000);
    }

    document.getElementById('retryBtn').addEventListener('click', () => {
      clearInterval(timer);
      checkHealth();
    });

    // Start initial countdown on load
    startCountdown();
  </script>
</body>
</html>
