<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>SINBHA - Personal Companion</title>
  <style>
    :root {
      --bg: #fff5f7;
      --card-bg: #ffffff;
      --text: #1e293b;
      --subtext: #64748b;
      --accent: #f472b6;
      --accent-deep: #db2777;
      --accent-glow: rgba(244, 114, 182, 0.35);
      --border: #fce7f3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      user-select: none;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(244, 114, 182, 0.15);
      position: relative;
    }
    .logo-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 20px var(--accent-glow);
      animation: float 3s ease-in-out infinite;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #0f172a;
    }
    h1 span {
      color: var(--accent-deep);
    }
    p {
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent-deep);
      font-weight: 500;
      margin-bottom: 22px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-deep);
      animation: blink 1.2s infinite;
    }
    .retry-btn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #fff;
      border: none;
      padding: 13px 32px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="pulse-ring"></div>
      <img src="elephant_logo.png" alt="SINBHA Logo" class="logo-img">
    </div>
    <h1>SINBHA is <span>Waking Up</span> 🌸</h1>
    <p>
      Your personal companion is spinning up in the cloud.<br>
      This takes just a few moments!
    </p>

    <div class="status-badge">
      <div class="dot"></div>
      <span id="statusText">Connecting in <b id="countdown">4</b>s...</span>
    </div>

    <div>
      <button id="retryBtn" class="retry-btn">Retry Now ⚡</button>
    </div>

    <div class="footer-note">
      Automatic health check • Always ready
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://sinbha-backend.onrender.com';
    let secondsLeft = 4;
    let timer = null;

    async function checkHealth() {
      const statusText = document.getElementById('statusText');
      statusText.innerHTML = 'Pinging cloud server...';

      try {
        const res = await fetch(`${BACKEND_URL}/api/health`, { cache: 'no-store' });
        if (res.ok) {
          statusText.innerHTML = 'Connected! Loading SINBHA... 🌸';
          window.location.replace(BACKEND_URL);
          return;
        }
      } catch (err) {
        // Cold start in progress or network glitch
      }

      secondsLeft = 5;
      startCountdown();
    }

    function startCountdown() {
      clearInterval(timer);
      const countdownEl = document.getElementById('countdown');
      const statusText = document.getElementById('statusText');

      timer = setInterval(() => {
        secondsLeft--;
        if (countdownEl) countdownEl.textContent = secondsLeft;
        statusText.innerHTML = `Connecting in <b>${secondsLeft}</b>s...`;

        if (secondsLeft <= 0) {
          clearInterval(timer);
          checkHealth();
        }
      }, 1000);
    }

    document.getElementById('retryBtn').addEventListener('click', () => {
      clearInterval(timer);
      checkHealth();
    });

    // Run first check right away
    checkHealth();
  </script>
</body>
</html>
