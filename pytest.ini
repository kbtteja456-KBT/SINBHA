[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Intentional framework deprecations documented without broad suppression:
    # 1. FastAPI on_event lifespan deprecation
    ignore:(?s).*on_event is deprecated.*:DeprecationWarning
    # 2. Starlette TestClient httpx2 suggestion in starlette.testclient
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning

