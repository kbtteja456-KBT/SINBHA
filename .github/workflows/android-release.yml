name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes or changelog'
        required: false
        default: 'Automated release build with latest reliability and companion updates.'
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Pre-Build Secrets Verification
        run: node scripts/check_secrets.js

      - name: Enforce VersionCode Increment & Sync Version
        run: node scripts/check_version_code.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "Keystore successfully prepared."

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build_android.log || {
            ERR=$(grep -A 8 -E "(What went wrong|e: )" ../build_android.log | head -n 25 | tr '\r\n' ' ' | sed 's/[^a-zA-Z0-9 .:()\/_-]/ /g')
            if [ -z "$ERR" ]; then
              ERR=$(grep -C 3 "FAILURE" ../build_android.log | head -n 25 | tr '\r\n' ' ' | sed 's/[^a-zA-Z0-9 .:()\/_-]/ /g')
            fi
            echo "::error title=Gradle Error::$ERR"
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: build-failure-log
          path: build_android.log

      - name: Shred and Remove Keystore File
        if: always()
        run: |
          rm -f android/app/release.keystore
          echo "Keystore deleted from build environment."

      - name: Prepare Release Artifacts and Checksum
        id: checksum
        run: |
          # Copy APK to root with clean public filename
          cp android/app/build/outputs/apk/release/app-release.apk SINBHA.apk
          
          # Generate SHA-256 checksum
          sha256sum SINBHA.apk > SINBHA.apk.sha256
          SHA_VAL=$(cut -d ' ' -f 1 SINBHA.apk.sha256)
          echo "sha256=${SHA_VAL}" >> $GITHUB_OUTPUT
          
          echo "Release artifacts prepared:"
          ls -lh SINBHA.apk SINBHA.apk.sha256
          cat SINBHA.apk.sha256

      - name: Determine Release Tag and Name
        id: release_meta
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="android-v${PACKAGE_VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=SINBHA Android Companion ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts (Backup)
        uses: actions/upload-artifact@v4.6.0
        with:
          name: SINBHA-Android-APK
          path: |
            SINBHA.apk
            SINBHA.apk.sha256
          retention-days: 14

      - name: Publish Release to Public sinbha-releases Repo
        uses: softprops/action-gh-release@v2.2.1
        with:
          repository: kbtteja456-KBT/sinbha-releases
          token: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body: |
            ## 🌸 SINBHA Android Companion Release
            **Version:** ${{ steps.release_meta.outputs.tag_name }}
            
            ${{ inputs.release_notes || 'Official production APK with exact alarms, background reminders, and flying bird overlay companion.' }}
            
            ### 📦 Download & Verification
            - Download `SINBHA.apk` below and open it on your Android device.
            - **SHA-256 Checksum:** `${{ steps.checksum.outputs.sha256 }}`
          files: |
            SINBHA.apk
            SINBHA.apk.sha256
          draft: false
          prerelease: false
