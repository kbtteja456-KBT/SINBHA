apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace = "com.sinbha.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.sinbha.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 29
        versionName "1.4.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (signingProps.containsKey('RELEASE_STORE_FILE')) {
                storeFile rootProject.file(signingProps.getProperty('RELEASE_STORE_FILE'))
                storePassword signingProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias signingProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword signingProps.getProperty('RELEASE_KEY_PASSWORD')
            } else if (System.getenv("KEYSTORE_FILE")) {
                def storePass = System.getenv("KEYSTORE_PASSWORD")
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword storePass
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword storePass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingProps.containsKey('RELEASE_STORE_FILE') || System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    def currentJavaVersion = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21) ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
    def jvmTargetStr = currentJavaVersion == JavaVersion.VERSION_21 ? "21" : "17"

    compileOptions {
        sourceCompatibility currentJavaVersion
        targetCompatibility currentJavaVersion
    }

    kotlinOptions {
        jvmTarget = jvmTargetStr
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
